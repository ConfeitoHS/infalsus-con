; PlatformIO configuration for the Infalsus game controller
; USB HID (keyboard + mouse) via TinyUSB
;
;   v1.1 (current) : RP2040 "Pro Micro" board            -> env rp2040
;   v1.0 (legacy)  : nice!nano v2 / SuperMini nRF52840   -> env nrf52840
; Same source; pick the environment for your board and wiring.

[platformio]
default_envs = rp2040

[env]
framework = arduino
build_flags = -DUSE_TINYUSB
monitor_speed = 115200

; ---------------- v1.0 legacy: nRF52840 (nice!nano v2 / SuperMini) ----------------
[nrf]
platform = nordicnrf52
board = nice_nano_v2
extra_scripts =
    pre:scripts/install_variant.py
    post:scripts/make_uf2.py

; Normal controller firmware (wiring v2: buttons right, LEDs left)
[env:nrf52840]
extends = nrf

; Same firmware for boards built with the older wiring
; (buttons on the left column D2-D7, LEDs on the right D10-D15)
[env:nrf52840_v1]
extends = nrf
build_flags = ${env.build_flags} -DWIRING_V1=1

; Reset / diagnostic firmware: erases saved settings, sweeps the LEDs and
; prints button/slider state over serial.  pio run -e reset -t upload
[env:reset]
extends = nrf
build_src_filter = -<*> +<../tools/reset/>

; ---------------- v1.1: RP2040 "Pro Micro" (Sea-Picro, SparkFun, clones) ----------------
; The Pico core produces firmware.uf2 itself: BOOTSEL-boot and drag it onto
; the RPI-RP2 drive, or pio run -e rp2040 -t upload.
[env:rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = sparkfun_promicrorp2040
board_build.core = earlephilhower
board_build.filesystem_size = 64k
build_flags = ${env.build_flags}

[env:rp2040_v1]
extends = env:rp2040
build_flags = ${env.build_flags} -DWIRING_V1=1
