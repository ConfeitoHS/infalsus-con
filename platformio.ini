; Infalsus controller v1.1 — RP2040 "Pro Micro" board
; USB HID (keyboard + mouse) via TinyUSB
;
; v1.0 (nice!nano / nRF52840) lives on the v1.0-nrf52840 branch.

[platformio]
default_envs = rp2040

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = sparkfun_promicrorp2040
board_build.core = earlephilhower
board_build.filesystem_size = 64k
framework = arduino
build_flags = -DUSE_TINYUSB
monitor_speed = 115200

; Controller firmware. Output: .pio/build/rp2040/firmware.uf2
;   pio run            -> build
;   pio run -t upload  -> upload (or BOOTSEL-boot and drag the .uf2 onto RPI-RP2)
[env:rp2040]

; Reset / diagnostic firmware: erases saved settings, sweeps the LEDs and
; prints button/slider state over serial.  pio run -e reset -t upload
[env:reset]
build_src_filter = -<*> +<../tools/reset/>
