; PlatformIO configuration for nRF52840 Game Controller
; USB HID (Keyboard + Mouse combo) via TinyUSB
; Hardware: nice!nano v2 (Pro Micro compatible nRF52840)

[env]
platform = nordicnrf52
board = nice_nano_v2
framework = arduino
extra_scripts =
    pre:scripts/install_variant.py
    post:scripts/make_uf2.py
build_flags = -DUSE_TINYUSB
monitor_speed = 115200

; Normal controller firmware (wiring v2: buttons right, LEDs left)
[env:nrf52840]

; Same firmware for boards built with the older wiring
; (buttons on the left column D2-D7, LEDs on the right D10-D15)
[env:nrf52840_v1]
build_flags = ${env.build_flags} -DWIRING_V1=1

; Reset / diagnostic firmware: erases saved settings, sweeps the LEDs and
; prints button/slider state over serial.  pio run -e reset -t upload
[env:reset]
build_src_filter = -<*> +<../tools/reset/>
