; PlatformIO configuration for nRF52840 Game Controller
; USB HID (Keyboard + Mouse combo) via TinyUSB
; Hardware: nice!nano v2 (Pro Micro compatible nRF52840)
;
; NOTE: Using SparkFun board definition because its g_ADigitalPinMap is
; a 1:1 identity mapping (Arduino pin N = nRF52840 GPIO N). This lets
; us specify nice!nano GPIO numbers directly in config.h without
; needing a custom board variant.

[env:nrf52840]
platform = nordicnrf52
board = sparkfun_pro_nrf52840_mini
framework = arduino

build_flags = -DUSE_TINYUSB

monitor_speed = 115200
