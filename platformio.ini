; PlatformIO configuration for ESP32-C3 Game Controller
; BLE HID (Keyboard + Mouse) — ESP32-C3 has no USB OTG

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

lib_deps =
    t-vk/ESP32 BLE Keyboard@^0.3.2
    t-vk/ESP32 BLE Mouse@^0.4.0

monitor_speed = 115200
