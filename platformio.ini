; PlatformIO configuration for the In Falsus controller
; USB HID (keyboard + mouse) via TinyUSB
;
; Environment = <board>-hw<version> (hw = hardware version: wiring and parts):
;   rp2040-hw1_1   : RP2040 "Pro Micro" board, buttons right, LEDs left
;   nrf52840-hw1_1 : nice!nano v2 / SuperMini nRF52840, buttons right, LEDs left
;   nrf52840-hw1_0 : nice!nano, first wiring (buttons left, LEDs right)
; reset-<same name> builds the reset / diagnostic firmware for that board.
; Same source for all of them.

[platformio]
default_envs = rp2040-hw1_1

[env]
framework = arduino
build_flags = -DUSE_TINYUSB
monitor_speed = 115200

; Reset / diagnostic firmware sources (erase settings, sweep LEDs, print state)
[reset]
build_src_filter = -<*> +<../tools/reset/>

; ---------------- RP2040 "Pro Micro" (Sea-Picro, SparkFun, clones) ----------------
; The Pico core produces firmware.uf2 itself: BOOTSEL-boot and drag
; .pio/build/<env>/firmware.uf2 onto the RPI-RP2 drive, or use -t upload.
[rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = sparkfun_promicrorp2040
board_build.core = earlephilhower
board_build.filesystem_size = 64k

[env:rp2040-hw1_1]
extends = rp2040

[env:reset-rp2040-hw1_1]
extends = rp2040, reset

; ---------------- nRF52840 (nice!nano v2 / SuperMini) ----------------
; make_uf2.py writes .pio/build/<env>/firmware.uf2 for the NICENANO drive.
[nrf]
platform = nordicnrf52
board = nice_nano_v2
extra_scripts =
    pre:scripts/install_variant.py
    post:scripts/make_uf2.py

[env:nrf52840-hw1_1]
extends = nrf

[env:nrf52840-hw1_0]
extends = nrf
build_flags = ${env.build_flags} -DHW_1_0=1

[env:reset-nrf52840-hw1_1]
extends = nrf, reset

[env:reset-nrf52840-hw1_0]
extends = nrf, reset
build_flags = ${env.build_flags} -DHW_1_0=1
