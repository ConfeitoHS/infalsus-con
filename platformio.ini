; PlatformIO configuration for the Infalsus game controller
; USB HID (keyboard + mouse) via TinyUSB
;
; Environment = board + hardware version (hw = wiring revision):
;   nrf52840-hw1_1 : nice!nano v2 / SuperMini nRF52840, buttons right, LEDs left
;   nrf52840-hw1_0 : nice!nano, first wiring (buttons left, LEDs right)
;   rp2040-hw1_1   : RP2040 "Pro Micro" board, buttons right, LEDs left
; Same source; pick the environment for your board and hardware version.

[platformio]
default_envs = rp2040-hw1_1

[env]
framework = arduino
build_flags = -DUSE_TINYUSB
monitor_speed = 115200

; ---------------- nRF52840 (nice!nano v2 / SuperMini) ----------------
[nrf]
platform = nordicnrf52
board = nice_nano_v2
extra_scripts =
    pre:scripts/install_variant.py
    post:scripts/make_uf2.py

; hw 1.1: buttons right, LEDs left
[env:nrf52840-hw1_1]
extends = nrf

; hw 1.0: first wiring (buttons on the left column D2-D7, LEDs on the right)
[env:nrf52840-hw1_0]
extends = nrf
build_flags = ${env.build_flags} -DHW_1_0=1

; Reset / diagnostic firmware: erases saved settings, sweeps the LEDs and
; prints button/slider state over serial.  pio run -e reset -t upload
[env:reset]
extends = nrf
build_src_filter = -<*> +<../tools/reset/>

; ---------------- RP2040 "Pro Micro" (Sea-Picro, SparkFun, clones) ----------------
; The Pico core produces firmware.uf2 itself: BOOTSEL-boot and drag it onto
; the RPI-RP2 drive, or pio run -e rp2040-hw1_1 -t upload.
[env:rp2040-hw1_1]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = sparkfun_promicrorp2040
board_build.core = earlephilhower
board_build.filesystem_size = 64k
build_flags = ${env.build_flags}
