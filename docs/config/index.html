<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Falsus Controller 설정</title>
<meta name="description" content="In Falsus Controller settings — LED brightness, slider sensitivity and direction over USB.">
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --ink: #1a2027; --muted: #5b6875; --line: #dde2e8;
  --accent: #2f6fd6; --accent-ink: #ffffff; --ok: #1f8a3b; --warn: #b36b00; --err: #b3261e;
  --chip: #eef2f7; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --card: #1a1f25; --ink: #e8ecf1; --muted: #9aa6b2; --line: #2c343d;
    --accent: #5b93f0; --accent-ink: #0b1220; --ok: #4cc26e; --warn: #e0a040; --err: #f07167;
    --chip: #232a32; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --card: #1a1f25; --ink: #e8ecf1; --muted: #9aa6b2; --line: #2c343d;
  --accent: #5b93f0; --accent-ink: #0b1220; --ok: #4cc26e; --warn: #e0a040; --err: #f07167;
  --chip: #232a32; --shadow: none;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
h1 { font-size: 24px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card h2 { font-size: 16px; margin: 0 0 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button {
  font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); padding: 8px 14px; cursor: pointer;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
button:not(:disabled):hover { filter: brightness(1.05); }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--ok); }
.notice { border-radius: 8px; padding: 10px 12px; margin-top: 12px; background: var(--chip); }
.notice.err { color: var(--err); }
.notice.warn { color: var(--warn); }
.notice:empty { display: none; }
dl.info { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dl.info dt { color: var(--muted); }
dl.info dd { margin: 0; font-weight: 600; }
.setting { padding: 14px 0; border-top: 1px solid var(--line); }
.setting:first-of-type { border-top: 0; padding-top: 2px; }
.setting-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.setting-head label { font-weight: 600; }
.setting-head .val { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.help { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=number] {
  font: inherit; width: 120px; padding: 6px 8px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
}
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.presets button { padding: 4px 10px; font-size: 13px; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 42px; height: 24px; accent-color: var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.dirty { color: var(--warn); font-weight: 600; }
.saved { color: var(--ok); font-weight: 600; }
details summary { cursor: pointer; color: var(--muted); }
pre.log {
  max-height: 220px; overflow: auto; background: var(--chip); border-radius: 8px;
  padding: 10px; font-size: 12px; margin: 10px 0 0; white-space: pre-wrap; word-break: break-all;
}
.posbar { position: relative; height: 12px; background: var(--chip); border-radius: 6px; margin: 12px 0 6px; }
.posbar .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.mk { position: absolute; top: -4px; width: 4px; height: 20px; border-radius: 2px; transform: translateX(-50%); }
.mk-center { background: var(--accent); }
.mk-pos { background: var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.choice { display: inline-flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.choice button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 7px 14px; }
.choice button:last-child { border-right: 0; }
.choice button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.hidden { display: none !important; }
footer { color: var(--muted); font-size: 13px; margin-top: 20px; }
code { background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.lang { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.lang select {
  font: inherit; font-size: 14px; padding: 5px 8px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <h1 data-i18n="title"></h1>
    <label class="lang"><span data-i18n="language"></span>
      <select id="lang">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="zh">简体中文</option>
        <option value="ja">日本語</option>
      </select>
    </label>
  </div>
  <p class="sub" data-i18n="subtitle"></p>

  <section class="card">
    <h2 data-i18n="conn_h"></h2>
    <div class="row">
      <button id="btn-connect" class="primary" data-i18n="btn_connect"></button>
      <button id="btn-disconnect" disabled data-i18n="btn_disconnect"></button>
      <button id="btn-demo" data-i18n="btn_demo"></button>
      <span class="status"><span id="dot" class="dot"></span><span id="status-text"></span></span>
    </div>
    <label class="help" style="display:flex;gap:6px;align-items:center;margin-top:10px">
      <input type="checkbox" id="all-ports"> <span data-i18n="all_ports"></span>
    </label>
    <div id="notice" class="notice"></div>
  </section>

  <section class="card hidden" id="card-device">
    <h2 data-i18n="dev_h"></h2>
    <dl class="info" id="device-info"></dl>
  </section>

  <section class="card hidden" id="card-settings">
    <h2 data-i18n="set_h"></h2>
    <div id="settings"></div>
    <div class="actions">
      <button id="btn-save" class="primary" data-i18n="btn_save"></button>
      <button id="btn-revert" data-i18n="btn_revert"></button>
      <button id="btn-defaults" data-i18n="btn_defaults"></button>
      <span id="save-state"></span>
    </div>
    <p class="help" style="margin-top:10px" data-i18n-html="save_hint"></p>
  </section>

  <section class="card">
    <details>
      <summary data-i18n="log_h"></summary>
      <pre class="log" id="log"></pre>
    </details>
  </section>

  <footer data-i18n="footer"></footer>
</main>

const LANGS = Object.keys(STR);
const HTML_LANG = { ko: "ko", en: "en", zh: "zh-Hans", ja: "ja" };

function pickLang() {
  try { const saved = localStorage.getItem("ifc-lang"); if (LANGS.includes(saved)) return saved; } catch (_) {}
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const base = String(l).toLowerCase().slice(0, 2);
    if (LANGS.includes(base)) return base;
  }
  return "en";
}
let lang = pickLang();

function t(key, vars = {}) {
  let s = (STR[lang] && STR[lang][key]) ?? STR.en[key] ?? key;
  for (const [k, v] of Object.entries(vars)) s = s.replace("{" + k + "}", v);
  return s;
}
// ---------------------------------------------------------------------------
// What this page understands. The firmware reports "proto"; anything else is
// refused so an old page never sends commands a newer firmware reads
// differently. Settings are shown only if the firmware lists them in "caps".
// ---------------------------------------------------------------------------
const PROTO_SUPPORTED = [1];

const BOARD_NAMES = {
  "rp2040-promicro": "RP2040 Pro Micro",
  "nrf52840-nicenano": "nice!nano (nRF52840)",
};
const SLIDER_KEYS = { pot: "slider_pot" };

// USB vendor IDs used to pre-filter the port chooser
const USB_FILTERS = [
  { usbVendorId: 0x2E8A },  // Raspberry Pi (RP2040)
  { usbVendorId: 0x1B4F },  // SparkFun (Pro Micro RP2040)
  { usbVendorId: 0x239A },  // Adafruit (nice!nano bootloader / core)
];

// Labels and help text come from STR (<key>_label / <key>_help)
const CONTROLS = {
  brightness: { kind: "range", step: 1, format: v => `${v} / 255 (${Math.round(v / 2.55)}%)` },
  px: { kind: "number", step: 10, presets: [1920, 2880, 3840, 5760, 7680], format: v => `${v} px` },
  reverse: { kind: "toggle", format: v => t(v ? "on" : "off") },
  center: { kind: "center", step: 1, format: v => fmtPct(v) },
  wake: { kind: "number", step: 1, presets: [16, 24, 32, 48, 64, 96, 128],
          format: v => `${v} (${t("wake_px", { px: (v * (current.px || 3840) / 32767).toFixed(1) })})` },
  recenter_keys: { kind: "choice", options: [5, 6], optLabel: v => t("recenter_keys_" + v), format: () => "" },
  recenter_taps: { kind: "choice", optLabel: v => t("taps_n", { n: v }), format: () => "" },
};

// 0-32767 slider units as % of travel, with the offset from the middle
function fmtPct(v) {
  const pct = v / 32767 * 100, d = pct - 50;
  return `${pct.toFixed(1)}% (${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(1)})`;
}

// ---------------------------------------------------------------------------
// Transports: real Web Serial port, or an in-page simulation of the firmware
// ---------------------------------------------------------------------------
class SerialTransport {
  constructor(port) { this.port = port; this.onLine = () => {}; this.onClose = () => {}; }
  async open() {
    await this.port.open({ baudRate: 115200 });
    // Some cores only send data once DTR is asserted
    try { await this.port.setSignals({ dataTerminalReady: true, requestToSend: true }); } catch (_) {}
    this.writer = this.port.writable.getWriter();
    this.enc = new TextEncoder();
    this.reading = this.readLoop();
  }
  async readLoop() {
    const dec = new TextDecoder();
    let buf = "";
    try {
      while (this.port.readable) {
        this.reader = this.port.readable.getReader();
        try {
          for (;;) {
            const { value, done } = await this.reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            let i;
            while ((i = buf.indexOf("\n")) >= 0) {
              const line = buf.slice(0, i).replace(/\r$/, "");
              buf = buf.slice(i + 1);
              if (line.length) this.onLine(line);
            }
          }
        } finally {
          this.reader.releaseLock();
          this.reader = null;
        }
        if (this.closing) break;
      }
    } catch (e) {
      if (!this.closing) log("! read error: " + e.message);
    }
    if (!this.closing) this.onClose();
  }
  async write(line) { await this.writer.write(this.enc.encode(line + "\n")); }
  async close() {
    this.closing = true;
    try { if (this.reader) await this.reader.cancel(); } catch (_) {}
    try { await this.reading; } catch (_) {}
    try { this.writer.releaseLock(); } catch (_) {}
    try { await this.port.close(); } catch (_) {}
  }
}

// Mirrors the firmware's command handling so the page can be tried without hardware
class DemoTransport {
  constructor() {
    this.onLine = () => {}; this.onClose = () => {};
    this.defaults = { brightness: 255, px: 3840, reverse: 0, center: 16384, recenter_keys: 5, recenter_taps: 4, wake: 64 };
    this.saved = { ...this.defaults, brightness: 180 };
    this.t0 = Date.now();
    this.cfg = { ...this.saved };
  }
  async open() { setTimeout(() => this.onLine("slider: connected"), 50); }
  async close() {}
  emit(obj) { setTimeout(() => this.onLine(JSON.stringify(obj)), 40); }
  dirty() { return JSON.stringify(this.cfg) !== JSON.stringify(this.saved); }
  // The demo slider drifts slowly around 53% so the position marker moves
  pos() { return Math.round(17400 + 6000 * Math.sin((Date.now() - this.t0) / 1400)); }
  settings(type) { return { ok: true, type, settings: { ...this.cfg }, dirty: this.dirty() }; }
  async write(line) {
    const [cmd, key, val] = line.trim().split(/\s+/);
    if (cmd === "info") return this.emit({
      ok: true, type: "info", name: "infalsus-con", fw: "1.3.0", proto: 1,
      board: "rp2040-promicro", hw: "1.1", slider: "pot", buttons: 6,
      caps: ["brightness", "px", "wake", "reverse", "center", "recenter_keys", "recenter_taps"],
      limits: { brightness: [0, 255], px: [100, 30000], reverse: [0, 1], center: [0, 32767], recenter_keys: [5, 6], recenter_taps: [3, 5], wake: [16, 512] },
      defaults: { ...this.defaults }, settings: { ...this.cfg }, dirty: this.dirty(),
    });
    if (cmd === "get") return this.emit(this.settings("settings"));
    if (cmd === "pos") return this.emit({ ok: true, type: "pos", pos: this.pos(), center: this.cfg.center });
    if (cmd === "center") { this.cfg.center = this.pos(); return this.emit(this.settings("settings")); }
    if (cmd === "save") { this.saved = { ...this.cfg }; return this.emit(this.settings("saved")); }
    if (cmd === "revert") { this.cfg = { ...this.saved }; return this.emit(this.settings("settings")); }
    if (cmd === "defaults") { this.cfg = { ...this.defaults }; return this.emit(this.settings("settings")); }
    if (cmd === "set") {
      const v = Number(val);
      const lim = { brightness: [0, 255], px: [100, 30000], reverse: [0, 1], center: [0, 32767], recenter_keys: [5, 6], recenter_taps: [3, 5], wake: [16, 512] }[key];
      if (!lim) return this.emit({ ok: false, error: "unknown setting" });
      if (!Number.isInteger(v) || v < lim[0] || v > lim[1]) return this.emit({ ok: false, error: key + " out of range" });
      if (key === "recenter_keys" && v !== 5 && v !== 6) return this.emit({ ok: false, error: "recenter_keys must be 5 or 6" });
      this.cfg[key] = v;
      return this.emit(this.settings("settings"));
    }
    this.emit({ ok: false, error: "unknown command" });
  }
}

// ---------------------------------------------------------------------------
// Device: one JSON reply per command, answered in order
// ---------------------------------------------------------------------------
class Device {
  constructor(transport) {
    this.t = transport;
    this.queue = [];      // { line, resolve, reject, key }
    this.inflight = null;
    this.t.onLine = line => this.handleLine(line);
  }
  handleLine(line) {
    if (!line.startsWith("{")) { log("  " + line); return; }
    let msg;
    try { msg = JSON.parse(line); } catch (_) { log("  " + line); return; }
    const job = this.inflight;
    if (!job || !job.quiet) log("← " + line);
    if (!job) return;
    clearTimeout(job.timer);
    this.inflight = null;
    job.resolve(msg);
    this.pump();
  }
  // key: commands with the same key replace a still-queued one (slider drags)
  send(line, key = null, quiet = false) {
    return new Promise((resolve, reject) => {
      if (key) {
        const q = this.queue.find(j => j.key === key);
        if (q) { q.resolve(null); Object.assign(q, { line, resolve, reject }); return; }
      }
      this.queue.push({ line, resolve, reject, key, quiet });
      this.pump();
    });
  }
  async pump() {
    if (this.inflight || !this.queue.length) return;
    const job = this.queue.shift();
    this.inflight = job;
    job.timer = setTimeout(() => {
      if (this.inflight !== job) return;
      this.inflight = null;
      job.reject(new Error("timeout"));
      this.pump();
    }, 2000);
    if (!job.quiet) log("→ " + job.line);
    try { await this.t.write(job.line); }
    catch (e) { clearTimeout(job.timer); this.inflight = null; job.reject(e); this.pump(); }
  }
}

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
let device = null, transport = null, info = null, current = {}, dragging = null;
let demoMode = false, lastDirty = false, noSerial = false;

function log(s) {
  const el = $("log");
  el.textContent += s + "\n";
  if (el.textContent.length > 40000) el.textContent = el.textContent.slice(-30000);
  el.scrollTop = el.scrollHeight;
}
function notice(text, kind = "") { const n = $("notice"); n.textContent = text; n.className = "notice " + kind; }
function setStatus(on, text) { $("dot").classList.toggle("on", on); $("status-text").textContent = text; }

function setConnectedUI(on) {
  $("btn-connect").disabled = on;
  $("btn-demo").disabled = on;
  $("btn-disconnect").disabled = !on;
  if (!on) { $("card-device").classList.add("hidden"); $("card-settings").classList.add("hidden"); }
}

async function connect(demo) {
  notice("");
  if (!demo && !("serial" in navigator)) {
    notice(t("no_serial"), "err");
    return;
  }
  try {
    if (demo) {
      transport = new DemoTransport();
    } else {
      const opts = $("all-ports").checked ? {} : { filters: USB_FILTERS };
      const port = await navigator.serial.requestPort(opts);
      transport = new SerialTransport(port);
    }
    await transport.open();
  } catch (e) {
    if (e && e.name === "NotFoundError") return;   // chooser cancelled
    notice(t("connect_fail", { msg: e.message || e }), "err");
    transport = null;
    return;
  }
  transport.onClose = () => { handleDisconnect("lost"); };
  device = new Device(transport);
  setConnectedUI(true);
  demoMode = demo;
  setStatus(true, t("status_checking"));

  let reply;
  try { reply = await device.send("info"); }
  catch (_) {
    notice(t("no_reply"), "err");
    return disconnect();
  }
  if (!reply || !reply.ok || reply.type !== "info") {
    notice(t("bad_reply"), "err");
    return disconnect();
  }
  if (!PROTO_SUPPORTED.includes(reply.proto)) {
    notice(t("proto", { p: reply.proto }), "err");
    return disconnect();
  }
  info = reply;
  setStatus(true, t(demo ? "status_demo" : "status_on"));
  renderInfo();
  renderSettings();
  applySettings(reply.settings, reply.dirty);
}

async function disconnect() {
  const tr = transport;
  transport = null; device = null; info = null;
  setConnectedUI(false);
  setStatus(false, t("status_off"));
  if (tr) await tr.close();
}

function handleDisconnect(key) {
  if (!transport) return;
  notice(t(key), "warn");
  disconnect();
}

function renderInfo() {
  const rows = [
    [t("row_fw"), info.fw],
    [t("row_board"), BOARD_NAMES[info.board] || info.board],
    [t("row_hw"), "hw" + info.hw],
    [t("row_slider"), SLIDER_KEYS[info.slider] ? t(SLIDER_KEYS[info.slider]) : info.slider],
    [t("row_buttons"), t("buttons_n", { n: info.buttons })],
  ];
  $("device-info").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${escapeHtml(String(v))}</dd>`).join("");
  $("card-device").classList.remove("hidden");
}

function renderSettings() {
  const box = $("settings");
  box.innerHTML = "";
  const unknown = [];
  for (const key of info.caps) {
    const def = CONTROLS[key];
    if (!def) { unknown.push(key); continue; }
    const [min, max] = (info.limits && info.limits[key]) || [0, 1];
    const wrap = document.createElement("div");
    wrap.className = "setting";
    wrap.innerHTML = `
      <div class="setting-head"><label for="ctl-${key}">${t(key + "_label")}</label><span class="val" id="val-${key}"></span></div>
      <div class="help">${t(key + "_help")}</div>`;
    if (def.kind === "range") {
      const r = el("input", { type: "range", id: "ctl-" + key, min, max, step: def.step });
      r.addEventListener("pointerdown", () => { dragging = key; });
      r.addEventListener("input", () => { showValue(key, +r.value); sendSet(key, +r.value); });
      r.addEventListener("change", () => { dragging = null; sendSet(key, +r.value); });
      wrap.append(r);
    } else if (def.kind === "number") {
      const r = el("input", { type: "range", id: "ctl-" + key, min, max, step: def.step });
      const n = el("input", { type: "number", id: "num-" + key, min, max, step: def.step });
      const row = el("div", { className: "row" });
      row.append(n);
      r.addEventListener("pointerdown", () => { dragging = key; });
      r.addEventListener("input", () => { n.value = r.value; showValue(key, +r.value); sendSet(key, +r.value); });
      r.addEventListener("change", () => { dragging = null; sendSet(key, +r.value); });
      n.addEventListener("change", () => {
        let v = Math.round(+n.value);
        if (!Number.isFinite(v)) return;
        v = Math.min(max, Math.max(min, v));
        n.value = r.value = v; showValue(key, v); sendSet(key, v);
      });
      wrap.append(r, row);
      if (def.presets) {
        const p = el("div", { className: "presets" });
        for (const v of def.presets.filter(v => v >= min && v <= max)) {
          const b = el("button", { type: "button", textContent: v.toLocaleString() });
          b.addEventListener("click", () => { n.value = r.value = v; showValue(key, v); sendSet(key, v); });
          p.append(b);
        }
        wrap.append(p);
      }
    } else if (def.kind === "center") {
      const r = el("input", { type: "range", id: "ctl-" + key, min, max, step: def.step });
      r.addEventListener("pointerdown", () => { dragging = key; });
      r.addEventListener("input", () => { showValue(key, +r.value); setMarker("mk-center", +r.value); sendSet(key, +r.value); });
      r.addEventListener("change", () => { dragging = null; sendSet(key, +r.value); });
      const bar = el("div", { className: "posbar" });
      bar.innerHTML = '<span class="mid"></span><span class="mk mk-center" id="mk-center"></span><span class="mk mk-pos" id="mk-pos" style="display:none"></span>';
      const leg = el("div", { className: "legend" });
      leg.innerHTML = `<span><i style="background:var(--accent)"></i>${t("center_set")}</span>` +
                      `<span><i style="background:var(--warn)"></i>${t("center_now")}: <b id="pos-now">–</b></span>`;
      const b = el("button", { type: "button", textContent: t("center_capture") });
      b.style.marginTop = "10px";
      b.addEventListener("click", () => command("center"));
      wrap.append(bar, leg, r, b);
    } else if (def.kind === "choice") {
      const opts = def.options || Array.from({ length: max - min + 1 }, (_, i) => min + i);
      const grp = el("div", { className: "choice", id: "ctl-" + key });
      grp.setAttribute("role", "radiogroup");
      for (const v of opts) {
        const b = el("button", { type: "button", textContent: def.optLabel(v) });
        b.dataset.v = v;
        b.setAttribute("role", "radio");
        b.addEventListener("click", () => { markChoice(key, v); sendSet(key, v); });
        grp.append(b);
      }
      wrap.append(grp);
    } else if (def.kind === "toggle") {
      const lab = el("label", { className: "switch" });
      const c = el("input", { type: "checkbox", id: "ctl-" + key });
      c.addEventListener("change", () => { showValue(key, c.checked ? 1 : 0); sendSet(key, c.checked ? 1 : 0); });
      lab.append(c, document.createTextNode(t("reverse_toggle")));
      wrap.append(lab);
    }
    box.append(wrap);
  }
  if (unknown.length) {
    const n = el("p", { className: "help" });
    n.textContent = t("unknown_caps", { list: unknown.join(", ") });
    box.append(n);
  }
  $("card-settings").classList.remove("hidden");
}

function showValue(key, v) {
  const def = CONTROLS[key];
  const s = $("val-" + key);
  if (def && s) s.textContent = def.format(v);
}

function applySettings(settings, dirty) {
  if (!settings) return;
  current = { ...settings };
  for (const [key, v] of Object.entries(settings)) {
    if (!CONTROLS[key] || !info.caps.includes(key)) continue;
    showValue(key, v);
    if (dragging === key) continue;   // do not fight the user's drag
    const c = $("ctl-" + key), n = $("num-" + key);
    if (c && c.type === "checkbox") c.checked = !!v;
    else if (c && c.classList.contains("choice")) markChoice(key, v);
    else if (c) c.value = v;
    if (n && document.activeElement !== n) n.value = v;
    if (key === "center") setMarker("mk-center", v);
  }
  if (settings.wake !== undefined && info.caps.includes("wake")) showValue("wake", settings.wake);
  const st = $("save-state");
  lastDirty = !!dirty;
  renderSaveState();
}

async function command(line, key) {
  if (!device) return;
  try {
    const r = await device.send(line, key);
    if (r === null) return;          // superseded by a newer value
    if (!r.ok) { notice(t("rejected", { msg: r.error }), "err"); return; }
    notice("");
    applySettings(r.settings, r.dirty);
  } catch (e) {
    notice(t("timeout", { msg: e.message }), "err");
  }
}

// Coalesce rapid slider moves: at most one set per key in the queue
function sendSet(key, v) { command(`set ${key} ${v}`, "set:" + key); }

function el(tag, props) { const e = document.createElement(tag); Object.assign(e, props); return e; }
function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }


function markChoice(key, v) {
  const g = $("ctl-" + key);
  if (!g) return;
  for (const b of g.children) {
    const on = +b.dataset.v === +v;
    b.classList.toggle("on", on);
    b.setAttribute("aria-checked", on ? "true" : "false");
  }
}

function setMarker(id, v) {
  const m = $(id);
  if (!m) return;
  if (v < 0) { m.style.display = "none"; return; }
  m.style.display = "";
  m.style.left = (v / 32767 * 100) + "%";
}

// Live slider position for the centre control (quiet: not written to the log)
let polling = false;
setInterval(async () => {
  if (!device || !info || !info.caps.includes("center") || document.hidden || polling || dragging) return;
  polling = true;
  try {
    const r = await device.send("pos", "pos", true);
    if (r && r.type === "pos") {
      setMarker("mk-pos", r.pos);
      const now = $("pos-now");
      if (now) now.textContent = r.pos < 0 ? t("center_unknown") : fmtPct(r.pos);
    }
  } catch (_) { /* a missed poll is harmless */ }
  polling = false;
}, 200);

function renderSaveState() {
  const st = $("save-state");
  st.textContent = t(lastDirty ? "dirty" : "saved");
  st.className = lastDirty ? "dirty" : "saved";
}

function applyLanguage() {
  document.documentElement.lang = HTML_LANG[lang];
  document.title = t("doc_title");
  $("lang").value = lang;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(e => { e.innerHTML = t(e.dataset.i18nHtml); });
  if (info) {
    setStatus(true, t(demoMode ? "status_demo" : "status_on"));
    renderInfo();
    renderSettings();
    applySettings(current, lastDirty);
  } else {
    setStatus(false, t("status_off"));
    if (noSerial) notice(t("no_serial") + t("demo_ok"), "warn");
  }
}

$("lang").addEventListener("change", e => {
  lang = e.target.value;
  try { localStorage.setItem("ifc-lang", lang); } catch (_) {}
  applyLanguage();
});

$("btn-connect").addEventListener("click", () => connect(false));
$("btn-demo").addEventListener("click", () => connect(true));
$("btn-disconnect").addEventListener("click", () => disconnect());
$("btn-save").addEventListener("click", () => command("save"));
$("btn-revert").addEventListener("click", () => command("revert"));
$("btn-defaults").addEventListener("click", () => command("defaults"));

if ("serial" in navigator) {
  navigator.serial.addEventListener("disconnect", e => {
    if (transport instanceof SerialTransport && e.target === transport.port) handleDisconnect("unplugged");
  });
} else {
  noSerial = true;
}
window.addEventListener("pointerup", () => { dragging = null; });
applyLanguage();
</script>
</body>
</html>
